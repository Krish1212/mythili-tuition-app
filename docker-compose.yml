version: '3.8'

services:
  app:
    build: .
    container_name: mythili_tuition_app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=wsgi:app
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:5000 --reload wsgi:app
