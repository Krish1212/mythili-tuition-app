{% extends 'base.html' %}

{% block content %}
<div class="page-heading">
    <div>
        <p class="eyebrow">Students</p>
        <h1>Edit {{ student['name'] }}</h1>
    </div>
    <a href="{{ url_for('students.all_students') }}" class="btn btn-outline-secondary"><i class="fa-solid fa-chevron-left"></i> Back</a>
</div>

{% with errors = get_flashed_messages(category_filter=['error']) %}
    {% if errors %}
        <div class="alert alert-danger app-alert">
            {% for error in errors[0] %}
                <div>{{ error }}</div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<section class="panel form-panel">
    <form action="{{ url_for('students.update_student', id=studentId) }}" method="POST" id="update-form" class="needs-validation" novalidate>
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <label>Name<input type="text" class="form-control" name="inputName" id="inputName" required value="{{ student.get('name', '') }}"></label>
            <label>Mobile<input type="text" class="form-control" name="inputMobile" id="inputMobile" required value="{{ student.get('mobile', '') }}"></label>
            <label>Standard<input type="text" class="form-control" name="inputStandard" id="inputStandard" required value="{{ student.get('standard', '') }}"></label>
            <label>School<input type="text" class="form-control" name="inputSchool" id="inputSchool" required value="{{ student.get('school', '') }}"></label>
            <label>Father's name<input type="text" class="form-control" name="inputFatherName" id="inputFatherName" required value="{{ student.get('father_name', '') }}"></label>
            <label>Mother's name<input type="text" class="form-control" name="inputMotherName" id="inputMotherName" required value="{{ student.get('mother_name', '') }}"></label>
            <label>Date of birth<input type="date" class="form-control" name="inputDateOfBirth" id="inputDateOfBirth" value="{{ student.get('date_of_birth', '') }}"></label>
            <label>Category
                <select class="form-select" name="inputCategory" id="inputCategory" required>
                    <option value="">Select category</option>
                    <option value="academic" {% if student.get('category') == 'academic' %}selected{% endif %}>Academic</option>
                    <option value="prachar_sabha" {% if student.get('category') == 'prachar_sabha' %}selected{% endif %}>Prachar Sabha</option>
                    <option value="both" {% if student.get('category') == 'both' %}selected{% endif %}>Both</option>
                </select>
            </label>
            <label>Fees<input type="text" class="form-control" name="inputFees" id="inputFees" required value="{{ student.get('fees', '') }}"></label>
            <label>Approved Gmail<input type="email" class="form-control" name="inputUserEmail" id="inputUserEmail" value="{{ student.get('user_email', '') }}" placeholder="student.parent@gmail.com"></label>
            <label>Firebase UID<input type="text" class="form-control" name="inputUserUid" id="inputUserUid" value="{{ student.get('user_uid', '') }}" placeholder="Auto-filled after first login if left blank"></label>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save changes</button>
        </div>
    </form>
</section>
{% endblock %}
